name: Build APK

on:
  workflow_dispatch:        # tombol "Run workflow" di tab Actions
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml', '.github/scripts/**']

permissions:
  contents: write   # untuk menerbitkan APK sebagai Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat proyek Android
        working-directory: app
        run: |
          flutter create . --org com.zaraa --project-name zaraa_party --platforms=android
          rm -f test/widget_test.dart

      - name: Pasang izin Android
        run: python3 .github/scripts/patch_android.py

      - name: Analisis kode
        working-directory: app
        continue-on-error: true
        run: |
          flutter pub get 2>&1 | tee ../pub.log || true
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../analyze.log || true
          ../.github/scripts/annotate.sh "pub get" ../pub.log "Because|version solving|Error|error"
          ../.github/scripts/annotate.sh "analyze" ../analyze.log " error • "

      - name: Build APK
        working-directory: app
        run: |
          set +e
          flutter build apk --release --dart-define=API_URL=${{ vars.API_URL }} 2>&1 | tee ../build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            ../.github/scripts/annotate.sh "build" ../build.log "Error|error:|FAILURE|What went wrong|Could not|\\.dart:[0-9]+"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: zaraa-party-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Tautan unduhan tetap: tab Releases > "terbaru".
      - name: Terbitkan Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk ZaraaParty.apk
          gh release delete terbaru --yes --cleanup-tag || true
          gh release create terbaru ZaraaParty.apk --title "Zaraa Party (terbaru)" --notes "APK terbaru dari commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
