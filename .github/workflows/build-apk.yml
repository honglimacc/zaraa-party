name: Build APK

on:
  workflow_dispatch:        # tombol "Run workflow" di tab Actions
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml', '.github/scripts/**']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek alamat server
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "::error::Variabel API_URL belum diisi. Settings > Secrets and variables > Actions > Variables > New repository variable (contoh: https://zaraa-party-api.onrender.com)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat proyek Android
        working-directory: app
        run: |
          flutter create . --org com.zaraa --project-name zaraa_party --platforms=android
          rm -f test/widget_test.dart

      - name: Pasang izin Android
        run: python3 .github/scripts/patch_android.py

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_URL=${{ vars.API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: zaraa-party-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
