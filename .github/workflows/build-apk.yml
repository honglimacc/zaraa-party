name: Build APK

on:
  workflow_dispatch:        # tombol "Run workflow" di tab Actions
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml', '.github/scripts/**', '.github/zaraa.keystore.enc']

permissions:
  contents: write   # untuk menerbitkan APK/AAB sebagai Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Kunci tanda tangan disimpan terenkripsi di repo; kata sandinya ada di Secret KEYSTORE_PASSPHRASE.
      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in .github/zaraa.keystore.enc -out "$RUNNER_TEMP/zaraa.p12" -pass env:KEYSTORE_PASSWORD
            echo "KEYSTORE_FILE=$RUNNER_TEMP/zaraa.p12" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_PASSPHRASE belum diisi. APK memakai kunci debug (login Google & Play Store tidak akan cocok)."
          fi

      - name: Buat proyek Android
        working-directory: app
        run: |
          flutter create . --org com.zaraa --project-name zaraa_party --platforms=android
          rm -f test/widget_test.dart

      - name: Pasang izin & tanda tangan Android
        run: python3 .github/scripts/patch_android.py

      - name: Analisis kode
        working-directory: app
        continue-on-error: true
        run: |
          flutter pub get 2>&1 | tee ../pub.log || true
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../analyze.log || true
          ../.github/scripts/annotate.sh "pub get" ../pub.log "Because|version solving|Error|error"
          ../.github/scripts/annotate.sh "analyze" ../analyze.log " error • "

      # Alamat server & Client ID Google dibaca dari app/app_config.json (bukan rahasia).
      - name: Build APK dan AAB
        working-directory: app
        run: |
          set +e
          flutter build apk --release --dart-define-from-file=app_config.json --build-number=${{ github.run_number }} 2>&1 | tee ../build.log
          code=${PIPESTATUS[0]}
          if [ "$code" = "0" ]; then
            flutter build appbundle --release --dart-define-from-file=app_config.json --build-number=${{ github.run_number }} 2>&1 | tee -a ../build.log
            code=${PIPESTATUS[0]}
          fi
          if [ "$code" != "0" ]; then
            grep -n -A14 "What went wrong" ../build.log | head -30 > ../build-tail.log
            ../.github/scripts/annotate.sh "build" ../build-tail.log "."
          fi
          exit $code

      - name: Tampilkan SHA-1 tanda tangan
        run: |
          keytool -printcert -jarfile app/build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA1|SHA256" | sed 's/^/::notice title=Tanda tangan APK::/'

      # Tautan unduhan tetap: tab Releases > "terbaru".
      - name: Terbitkan Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk ZaraaParty.apk
          cp app/build/app/outputs/bundle/release/app-release.aab ZaraaParty.aab
          gh release delete terbaru --yes --cleanup-tag || true
          gh release create terbaru ZaraaParty.apk ZaraaParty.aab --title "Zaraa Party (terbaru)" --notes "Build #${{ github.run_number }} dari commit ${GITHUB_SHA::7}. APK untuk dipasang langsung; AAB untuk diunggah ke Google Play." --target "$GITHUB_SHA"
