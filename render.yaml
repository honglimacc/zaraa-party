# Blueprint Render: membuat server API + database PostgreSQL sekaligus.
databases:
  - name: zaraa-db
    plan: free
    databaseName: zaraa_party
    user: zaraa

services:
  - type: web
    name: zaraa-party-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    # migrate & seed aman dijalankan berulang (IF NOT EXISTS / upsert).
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: zaraa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_USERNAME
        value: developer
      - key: DEV_PASSWORD
        sync: false        # diisi sendiri saat deploy pertama (min. 8 karakter)
      - key: PUBLIC_URL
        sync: false        # alamat https layanan ini, contoh https://zaraa-party-api.onrender.com
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: false
